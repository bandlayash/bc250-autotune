[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bc250-mcp"
version = "0.1.0"
description = "MCP server exposing AMD BC-250 telemetry and tuning controls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
bc250-mcp = "bc250_mcp.server:main"

[tool.setuptools.packages.find]
include = ["bc250_mcp*"]

[tool.setuptools.package-data]
bc250_mcp = ["safety_envelope.yaml"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
